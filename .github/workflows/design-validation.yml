name: Design and knowledge validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check architecture index and v7 configs
        run: python scripts/validate_work.py
      - name: Check complete v6 migration and all canonical links
        run: python scripts/validate_migration.py
      - name: Validate connected content registries
        run: python scripts/validate_content.py
      - name: Run design invariants
        run: python -m unittest discover -s tests -v
