name: Design and knowledge validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check architecture index and v7 configs
        run: python scripts/validate_work.py
      - name: Check complete v6 migration and all canonical links
        run: python scripts/validate_migration.py
      - name: Validate connected content registries
        run: python scripts/validate_content.py
      - name: Check BUILD-SKILL proposal witnesses (no runtime)
        run: python scripts/validate_build_proposal.py
      - name: Check content impact on canonical mark status
        run: python scripts/content_impact.py --id status.mark --json
      - name: Check GAME-ARCH-00/01 run and XP receipts (no game)
        run: python scripts/validate_run_loop_proposal.py
      - name: Check GAME-UX cross-layer choice and evolution witness
        run: python scripts/validate_choice_bridge_proposal.py
      - name: Verify FOUNDATION-2026 research-backed design gates
        run: python scripts/validate_foundation_gates.py
      - name: Verify SAVE-CONTRACT-001 checkpoint and deterministic choice replay
        run: python scripts/validate_save_contract_proposal.py
      - name: Verify CHOICE-VIEWMODEL-001 hand actions and persisted draft overlay
        run: python scripts/validate_choice_viewmodel_proposal.py
      - name: Verify DRAFT-CONTRACT-002 integer RNG and run-scoped draft replay
        run: python scripts/validate_draft_contract_proposal.py
      - name: Verify CHOICE-SAVE-002 integrated SaveEnvelope v2 (design-only)
        run: python scripts/validate_choice_save_proposal.py
      - name: Verify ARCH-02 recipe reachability graph (design-only)
        run: python scripts/validate_recipe_graph_proposal.py
      - name: Verify ARCH-04 effect ops, provenance and finite chains (design-only)
        run: python scripts/validate_effect_chain_proposal.py
      - name: Verify GAME-ARCH-02 arena, telegraphs, boss pattern and reward order (design-only)
        run: python scripts/validate_encounter_proposal.py
      - name: Verify P0-00 generated ContentRegistry equals v7 sources (digest parity)
        run: python tools/content/generate_registry.py --check
      - name: Verify ADR-007 hip-rng-v1 and rules-hash golden vectors are reproducible
        run: |
          python tools/content/hip_rng.py --check
          python tools/content/rules_identity.py --check
      - name: Verify DEV-ENV-001 pinned toolchain lock (no network)
        run: python scripts/validate_toolchain.py
      - name: Verify ART-REF-001 reference catalog (structure, canonical IDs, README parity)
        run: python scripts/ref_catalog.py validate
      - name: Verify DEV-ENV-002 agent skills, triggers and client adapters
        run: python scripts/validate_agent_skills.py
      - name: Verify DEV-ENV-003 MCP registry and secret-free example configs
        run: python scripts/validate_mcp.py
      - name: Verify DEV-ENV-004 system binding, gap register and schema coverage
        run: python scripts/system_binding.py validate
      - name: Verify DEV-ENV-005 tooling matrix parity with locks
        run: python scripts/tooling_matrix.py validate
      - name: Run design invariants
        run: python -m unittest discover -s tests -v
